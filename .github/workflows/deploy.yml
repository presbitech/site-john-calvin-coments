name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        
      - name: Run TypeScript type checking
        id: typescript-check
        run: npx tsc --noEmit
        
      - name: Run unit tests
        id: unit-tests
        run: npm run test:unit
        
      - name: Install Playwright dependencies
        run: npx playwright install --with-deps
        
      - name: Run Playwright tests
        id: playwright-tests
        run: npm run test:report
        continue-on-error: true
        
      - name: Check if all tests passed
        id: test-check
        run: |
          if [ ${{ steps.typescript-check.outcome }} == 'success' ] && [ ${{ steps.unit-tests.outcome }} == 'success' ]; then
            echo "All critical tests passed, proceeding with deployment"
            echo "proceed=true" >> $GITHUB_OUTPUT
          else
            echo "Critical tests failed, aborting deployment"
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: Build
        if: steps.test-check.outputs.proceed == 'true'
        env:
          NODE_ENV: production
        run: |
          npm run build
          touch build/.nojekyll
          
      - name: Upload artifact
        if: steps.test-check.outputs.proceed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    needs: build
    if: success()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
